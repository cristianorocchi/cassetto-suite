[project]
name = "plastico"
version = "0.1.0"
description = "A 3D model of a game's world: its scenes and the ways between them, read from and written to a Godot project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11.0",
]

[project.scripts]
plastico = "plastico.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plastico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
