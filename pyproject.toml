[project]
name = "cassetto"
version = "0.2.0.dev6"
description = "A desktop suite for designing narrative and point-and-click games: Plastico (the world) and Puzzle Charts (the puzzles), in one project."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11.0",
]

[project.optional-dependencies]
# the native window; without it Cassetto opens in a Chrome/Chromium app window or the browser
desktop = [
    "pywebview>=5.0",
    "PyQt6>=6.6",
    "PyQt6-WebEngine>=6.6",
    "qtpy>=2.4",
]

[project.scripts]
cassetto = "cassetto.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "playwright>=1.45"]
build = ["pyinstaller>=6.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cassetto", "plastico/src/plastico"]

[tool.pytest.ini_options]
testpaths = ["tests", "plastico/tests"]
