<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cassetto</title>
<link rel="icon" href="/shell/icon.svg">
<link rel="stylesheet" href="/shared/fonts.css">
<link rel="stylesheet" href="/shell/shell.css">
</head>
<body>
<div class="suite" id="suite">
  <header class="bar">
    <button class="tree-toggle" id="btn-tree" type="button" aria-pressed="true" aria-controls="tree" title="Show or hide the project tree (Ctrl+B)">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 2.5v11" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
    <div class="brand" title="Cassetto">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M2.5 11h19" stroke="currentColor" stroke-width="1.6"/><rect x="9" y="13.6" width="6" height="2.4" rx="1.2" fill="currentColor"/></svg>
      <span class="brand-name">Cassetto</span>
    </div>
    <div class="menu-wrap">
      <button class="proj" id="btn-project" type="button" aria-haspopup="true" aria-expanded="false" title="Project">
        <span class="proj-name" id="proj-name">No project</span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="menu" id="menu-project" hidden></div>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Modules"></nav>
    <div class="bar-right">
      <div class="menu-wrap">
        <button class="chip" id="btn-links" type="button" hidden aria-haspopup="true" aria-expanded="false"></button>
        <div class="menu right wide" id="menu-links" hidden></div>
      </div>
      <button class="chip" id="btn-godot" type="button" hidden></button>
      <span class="status" id="status" data-s="ok" title=""><span class="dot"></span><span id="status-text">Ready</span></span>
    </div>
  </header>

  <main class="stage" id="stage">
    <aside class="tree" id="tree" aria-label="Project tree" hidden>
      <div class="tree-head"><span>Project</span><button class="tree-btn" id="tree-collapse" type="button" title="Collapse everything">Collapse all</button></div>
      <div class="tree-body" id="tree-body" role="tree"></div>
    </aside>
    <div class="work" id="work">
    <section class="welcome" id="welcome" hidden>
      <div class="welcome-box">
        <h1>Cassetto</h1>
        <p class="lede">Design the structure of a narrative game: its world in Plastico, its puzzles in Puzzle Charts, in one project.</p>
        <div class="welcome-actions">
          <button class="btn primary big" type="button" data-act="new">New project</button>
          <button class="btn big" type="button" data-act="open">Open a project…</button>
          <button class="btn big" type="button" data-act="import">Import a project…</button>
        </div>
        <div class="alert bad" id="welcome-error" hidden></div>
        <h2>Recent</h2>
        <ul class="recent" id="recent"></ul>
      </div>
    </section>
    <div class="frames" id="frames"></div>
    <div class="loading" id="loading" hidden>Opening…</div>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="modal" id="modal" hidden><div class="modal-box" id="modal-box" role="dialog" aria-modal="true"></div></div>
<script src="/shell/shell.js"></script>
</body>
</html>
